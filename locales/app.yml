games_mistake.only_keep_opening_hands:
  de: "Behalte nur Starthände mit 2–4 Ländern. Mit 0–1 Land fehlt dir das Mana, mit 5 oder mehr fehlen die Zauber. Ein Mulligan auf 6 Karten ist meist besser als so eine Hand."
  en: "Only keep opening hands with 2–4 lands. With 0–1 land you lack mana, with 5 or more you lack spells. A mulligan to 6 cards is usually better than such a hand."
games_mistake.low_life_pays_off:
  de: "Bei wenig Leben lohnt es sich zu blocken, auch wenn deine Kreatur dabei stirbt. Dann sind deine Lebenspunkte wichtiger als die Kreatur."
  en: "At low life it pays off to block, even if your creature dies. Then your life total matters more than the creature."
games_mistake.did_block_low_life:
  de: "Bei wenig Leben nicht geblockt"
  en: "Did not block at low life"
games_mistake.better_play_possible:
  de: "Besserer Zug möglich"
  en: "Better play possible"
games_mistake.these_cards_castable_hand:
  de: "Diese Karten lagen mehrere Züge bezahlbar auf deiner Hand. Spiel sie früher – oder tausch sie im Deck gegen etwas, das du wirklich spielst. (Spontanzauber zählen hier nicht mit.)"
  en: "These cards were castable in your hand for several turns. Cast them earlier – or swap them in the deck for something you really play. (Instants do not count here.)"
games_mistake.conceded_early:
  de: "Früh aufgegeben"
  en: "Conceded early"
games_mistake.safe_attack_skipped:
  de: "Gefahrlosen Angriff ausgelassen"
  en: "Safe attack skipped"
games_mistake.especially_low_ranks_opponents:
  de: "Gerade auf niedrigen Rängen machen Gegner oft Fehler, und Partien drehen sich. Spiel weiter, solange du noch Leben hast."
  en: "Especially at low ranks, opponents often make mistakes and games turn around. Keep playing as long as you still have life."
games_mistake.card_played_long_time:
  de: "Karte lange nicht gespielt"
  en: "Card not played for a long time"
games_mistake.no_creature_battlefield:
  de: "Keine Kreatur auf dem Feld"
  en: "No creature on the battlefield"
games_mistake.land_played:
  de: "Land nicht gespielt"
  en: "Land not played"
games_mistake.play_land_every_turn:
  de: "Lege jeden Zug ein Land, wenn du eins hast – auch wenn du es gerade nicht brauchst. Später fehlt es sonst."
  en: "Play a land every turn if you have one – even if you don't need it right now. Otherwise it will be missing later."
games_mistake.mana_unused:
  de: "Mana ungenutzt"
  en: "Mana unused"
games_mistake.use_mana_every_turn:
  de: "Nutze dein Mana in jedem Zug. Eine Kreatur auf der Hand macht keinen Schaden – spiel sie, sobald du kannst. (Die Farben prüft die App nicht; manchmal fehlte also die passende Farbe.)"
  en: "Use your mana every turn. A creature in your hand deals no damage – cast it as soon as you can. (The app does not check colors; sometimes the right color was missing.)"
games_mistake.risky_opening_hand_kept:
  de: "Riskante Starthand behalten"
  en: "Risky opening hand kept"
games_mistake.no_opposing_creature_block:
  de: "Wenn keine gegnerische Kreatur deinen Angreifer blocken und dabei töten kann, greif an. Schlimmstenfalls opfert der Gegner einen Blocker, sonst verliert er Leben. (Fliegend, Reichweite, Todesberührung und Bedrohlich sind berücksichtigt, Zaubertricks des Gegners nicht.)"
  en: "If no opposing creature can block your attacker and kill it, attack. At worst the opponent sacrifices a blocker, otherwise they lose life. (Flying, reach, deathtouch and menace are taken into account, the opponent's tricks are not.)"
games_mistake.turns_3_6_had:
  de: "In Zug 3–6 lag keine eigene Kreatur auf dem Feld – dann kannst du keinen Druck machen und nicht blocken. Spiel früh günstige Kreaturen; ein Deck braucht genug davon für die Züge 1–3."
  en: "On turns 3–6 you had no creature on the battlefield – then you cannot put on pressure or block. Play cheap creatures early; a deck needs enough of them for turns 1–3."
games_mistake.companions_turn_suggestion_would:
  de: "Der Zugvorschlag des Begleitfensters hätte in diesen Zügen mehr aus deinem Mana gemacht – mit Blick auf Farben und gegnerische Kreaturen. Oft lohnen zwei günstige Karten statt einer teuren oder Entfernung vor der nächsten Kreatur."
  en: "The companion's turn suggestion would have made more of your mana in these turns – considering colors and opposing creatures. Often two cheap cards are better than one expensive card, or removal before the next creature."
