[package]
name = "mtg_arena_builder"
version = "0.1.0"
edition = "2024"
description = "Turnierdecks mit der eigenen MTG-Arena-Sammlung abgleichen"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.29", features = ["persistence"] }
egui_extras = "0.29"
egui_plot = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mtga-reader = { git = "https://github.com/mtgatool/mtga-reader", rev = "51dd0f2570dbd45053b4ec01ce504dc8adcac2a3", version = "0.0.0" }
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"

# Bettet Logo und Versionsinfos in die Windows-Exe ein (siehe build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Optimierte Auslieferungsversion: maximale Optimierung über alle Crates hinweg,
# ohne Debug-Symbole. "panic = abort" bewusst NICHT gesetzt – der Speicherleser
# darf paniken, ohne die App mitzureißen.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Entwicklungs-Builds: eigene Crate schnell kompilieren, Abhängigkeiten optimiert
# (sonst ist die Oberfläche im Debug-Build zäh).
[profile.dev.package."*"]
opt-level = 2
