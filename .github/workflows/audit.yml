# Checks the dependencies against the RustSec database of known
# vulnerabilities – on changes to Cargo.lock and weekly, because new
# advisories appear without any change on our side.
name: Audit

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Default for all jobs: read only.
permissions:
  contents: read

jobs:
  advisories:
    name: Advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
