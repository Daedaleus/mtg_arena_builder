# Prüft und baut die App auf Windows, Linux und macOS.
# Formatierung und Testabdeckung laufen einmal (Linux), Clippy, Tests und
# Release-Build auf allen drei Systemen. Die fertigen Programme stehen als
# Artefakte am Lauf zum Herunterladen bereit.
#
# Ein Versions-Tag (z. B. `v0.2.0`, passend zu `version` in Cargo.toml) löst
# denselben Lauf aus; sind alle Prüfungen grün, entsteht daraus ein
# GitHub-Release mit den Programmen und ihren SHA-256-Prüfsummen.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: mtg_arena_builder-windows-x64
            binary: target/release/mtg_arena_builder.exe
            optional: false
          - name: Linux
            os: ubuntu-latest
            artifact: mtg_arena_builder-linux-x64
            binary: target/release/mtg_arena_builder
            optional: false
          - name: macOS
            os: macos-latest
            artifact: mtg_arena_builder-macos-arm64
            binary: target/release/mtg_arena_builder
            # GitHub teilt macOS-Rechner oft erst spät oder gar nicht zu – ein
            # Ausfall dort macht den Lauf nicht rot (Windows und Linux schon).
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Pakete für die Oberfläche
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Release-Build
        run: cargo build --release --locked
      - name: Programm und Prüfsumme bereitlegen
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          name="${{ matrix.artifact }}$ext"
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/$name"
          cd dist
          # Windows (Git Bash) und Linux haben sha256sum, macOS nur shasum.
          if command -v sha256sum > /dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  coverage:
    name: Testabdeckung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Linux-Pakete für die Oberfläche
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      # Wie coverage.ps1: Oberfläche, Programmstart und Testhilfen zählen nicht mit.
      - name: Abdeckung messen (mindestens 90 %)
        run: >
          cargo llvm-cov --lib --locked
          --ignore-filename-regex '[\\/]app[\\/]|(testutil|main)\.rs$|[\\/]tests[\\/]'
          --fail-under-lines 90

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, build, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag passt zur Version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Version $version in Cargo.toml"
            exit 1
          fi
      # macOS darf fehlen (siehe oben) – dann enthält das Release nur
      # Windows und Linux.
      - uses: actions/download-artifact@v6
        with:
          pattern: mtg_arena_builder-*
          path: dist
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "MTG Arena Builder $GITHUB_REF_NAME"
          --generate-notes
