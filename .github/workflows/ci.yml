# Checks and builds the app on Windows, Linux and macOS.
# Formatting and coverage run once (Linux); Clippy, tests and the release
# build on all three systems. The built programs are available as artifacts
# of the run.
#
# A version tag (e.g. `v0.2.0`, matching `version` in Cargo.toml) triggers the
# same run; if every check passes, it becomes a GitHub release with the
# programs and their SHA-256 checksums.
#
# Security: every built program is scanned for malware (Defender on Windows,
# ClamAV for all), releases get a signed build provenance attestation.
# Dependencies are checked by audit.yml.
#
# Tools and check commands come from mise.toml (like `mise run …` locally):
# the same versions and tasks on every machine.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Default for all jobs: read only. Jobs that need more (release) say so.
permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - run: mise run fmt-check

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: mtg_arena_builder-windows-x64
            binary: target/release/mtg_arena_builder.exe
            optional: false
          - name: Linux
            os: ubuntu-latest
            artifact: mtg_arena_builder-linux-x64
            binary: target/release/mtg_arena_builder
            optional: false
          - name: macOS
            os: macos-latest
            artifact: mtg_arena_builder-macos-arm64
            binary: target/release/mtg_arena_builder
            # GitHub often assigns macOS runners late or not at all – a
            # failure there doesn't fail the run (Windows and Linux do).
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    # Without cache (e.g. after changes to Cargo.toml or the toolchain)
    # Windows needs over 30 minutes for Clippy, tests and the release build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the interface
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Clippy
        run: mise run clippy
      - name: Tests
        run: mise run test
      - name: Release build
        run: cargo build --release --locked
      - name: Program and checksum
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          name="${{ matrix.artifact }}$ext"
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/$name"
          cd dist
          # Windows (Git Bash) and Linux have sha256sum, macOS only shasum.
          if command -v sha256sum > /dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
      # GitHub's Windows runners come with Microsoft Defender: update the
      # signatures and scan the built program.
      - name: Malware scan (Microsoft Defender)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          & $mp -SignatureUpdate | Out-Host
          & $mp -Scan -ScanType 3 -File (Resolve-Path dist) -DisableRemediation | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Defender reports a detection (exit $LASTEXITCODE)" }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  scan:
    name: Malware scan (ClamAV)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mtg_arena_builder-*
          path: dist
          merge-multiple: true
      - name: Install ClamAV and load signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Scan programs
        run: clamscan --recursive --infected dist

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust github:taiki-e/cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for the interface
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      # Filter (interface, program start, test helpers) and minimum are in
      # mise.toml.
      - name: Measure coverage (at least 90 %)
        run: mise run coverage

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, build, coverage, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # for the build provenance attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # full history with tags – for the changelog since the last release
          fetch-depth: 0
      - name: Tag matches the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      # macOS may be missing (see above) – then the release only contains
      # Windows and Linux.
      - uses: actions/download-artifact@v8
        with:
          pattern: mtg_arena_builder-*
          path: dist
          merge-multiple: true
      - name: Combined checksum file
        run: |
          cd dist
          sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Signed proof that exactly these files were built by this workflow from
      # this commit (verify with `gh attestation verify`).
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS.txt
      # Changes since the last release from the commit messages (cliff.toml),
      # followed by download and verification hints.
      - uses: jdx/mise-action@v5
        with:
          install_args: git-cliff
      - name: Release notes
        run: |
          {
            echo "## What's changed"
            git cliff --current --strip all
            echo
            cat .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "MTG Arena Builder $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
