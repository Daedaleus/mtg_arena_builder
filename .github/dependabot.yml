# Wöchentliche Updates für Rust-Abhängigkeiten und GitHub Actions,
# jeweils in einem gesammelten Pull Request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    # Große Versionssprünge ändern die API und sind ein eigener Umbau; bei
    # egui/eframe gilt das schon für 0.29 auf 0.30. Automatisch also nur
    # kompatible Updates – Sicherheitsupdates meldet Dependabot unabhängig
    # davon.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'egui*'
        update-types: ['version-update:semver-minor']
      - dependency-name: eframe
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
