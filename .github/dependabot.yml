# Weekly updates for Rust dependencies and GitHub Actions, each bundled in
# one pull request. mise.toml (Rust and tool versions) is not covered.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Conventional commit messages: "build(deps): …"
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ['*']
    # Major versions change the API and are a rework of their own; for
    # egui/eframe even 0.29 to 0.30 is. So only compatible updates come
    # automatically – security updates are reported by Dependabot anyway.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'egui*'
        update-types: ['version-update:semver-minor']
      - dependency-name: eframe
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
