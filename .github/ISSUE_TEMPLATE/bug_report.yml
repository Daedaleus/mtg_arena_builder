name: Bug report
description: Something does not work or shows wrong results.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the
        [open issues](https://github.com/Daedaleus/mtg_arena_builder/issues) first.
        Security problems please report privately, see
        [SECURITY.md](https://github.com/Daedaleus/mtg_arena_builder/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Tournament decks
        - Official events
        - From my collection
        - Own list
        - My games
        - Improve deck
        - Companion window
        - Sample hands
        - Reading the collection
        - Settings / language
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release name (e.g. v0.1.0) or commit, if you built it yourself.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - German
  - type: textarea
    id: details
    attributes:
      label: Screenshots, error messages, deck list
      description: |
        Anything that helps to reproduce it. For problems with game analysis or
        the companion window, the relevant part of Arena's `Player.log` helps a
        lot – please remove anything you do not want to share.
