name: Idea
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Planned items are listed in
        [TODO.md](https://github.com/Daedaleus/mtg_arena_builder/blob/main/TODO.md).
  - type: textarea
    id: problem
    attributes:
      label: What would help you?
      description: Describe the situation in Arena or in the app where something is missing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could the app help here? Mock-ups or examples are welcome.
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other tools that do this, links, deck lists …
