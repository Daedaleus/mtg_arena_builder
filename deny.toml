# Einstellungen für cargo-deny (siehe .github/workflows/audit.yml).

[advisories]
# Bekannte Meldungen, die das Programm nicht betreffen. Jede Ausnahme mit
# Grund; beim nächsten egui-Upgrade prüfen, ob sie entfallen kann.
ignore = [
    # quick-xml 0.30 kommt nur über eframe 0.29 > accesskit_unix > zbus_xml
    # herein (Bedienungshilfen, nur Linux) und liest dort XML vom lokalen
    # D-Bus, nicht aus dem Netz. Ein Update geht erst mit neuerem egui.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via accesskit_unix (Linux D-Bus only); needs egui upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via accesskit_unix (Linux D-Bus only); needs egui upgrade" },
]
