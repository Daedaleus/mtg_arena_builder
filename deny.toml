# Settings for cargo-deny (see .github/workflows/audit.yml).

[advisories]
# Known advisories that don't affect the program. Every exception with a
# reason; check at the next egui upgrade whether it can go.
ignore = [
    # quick-xml 0.30 only comes in through eframe 0.29 > accesskit_unix >
    # zbus_xml (accessibility, Linux only) and reads XML from the local D-Bus
    # there, not from the network. An update needs a newer egui.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via accesskit_unix (Linux D-Bus only); needs egui upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via accesskit_unix (Linux D-Bus only); needs egui upgrade" },
]
